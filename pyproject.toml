[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arrstack-mcp"
dynamic = ["version"]
description = "MCP server for Sonarr, Radarr, Lidarr, Prowlarr, qBittorrent, SABnzbd, Jellyfin, Seerr, RomM, GameVault and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CT4nk3r" }]
keywords = ["mcp", "model-context-protocol", "sonarr", "radarr", "jellyfin", "qbittorrent", "homelab"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia",
  "Environment :: Console",
]
# Keep in sync with requirements.txt (used by the Docker image and CI).
dependencies = [
  "mcp[cli]>=1.9.0,<2",
  "httpx>=0.27.0",
  "uvicorn>=0.30.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
arrstack-mcp = "arrstack_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ct4nk3r/arrstack-mcp"
Issues = "https://github.com/ct4nk3r/arrstack-mcp/issues"

[tool.hatch.version]
path = "arrstack_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["arrstack_mcp"]

[tool.hatch.build.targets.sdist]
include = ["arrstack_mcp", "server.py", "README.md", "LICENSE", ".env.example", "docker-compose.yml"]
