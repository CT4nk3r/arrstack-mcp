name: Publish Docker image

# Publishes ghcr.io/ct4nk3r/arrstack-mcp:
#   release tag v1.2.3 -> :1.2.3, :1.2, :1, :latest
#   push to main       -> :edge (bleeding edge, may break)
# Pull requests only build (no push) so a broken Dockerfile is caught early.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - "*.py"
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ct4nk3r/arrstack-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=arrstack-mcp
            org.opencontainers.image.description=MCP server for Sonarr, Radarr, qBittorrent, Jellyfin and more
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t arrstack-mcp:test .
          docker run --rm arrstack-mcp:test --print-env-example | head -1
          docker run --rm -e SONARR_URL=http://sonarr:8989 -e SONARR_API_KEY=x \
            arrstack-mcp:test --list-services
