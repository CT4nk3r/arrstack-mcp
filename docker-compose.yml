services:
  arrstack-mcp:
    # Published image; update with `docker compose pull && docker compose up -d`.
    # Pin a version (e.g. :1.0) to avoid surprises, or use :edge for the latest main.
    image: ghcr.io/ct4nk3r/arrstack-mcp:latest
    # To build from this checkout instead, replace `image:` with `build: .`
    container_name: arrstack-mcp
    ports:
      # Published on localhost only: this server has no authentication, and
      # anyone who can reach the port can add or delete downloads. Containers on
      # the same Docker network reach it at http://arrstack-mcp:8000/mcp without
      # this mapping. To reach it from another machine, put it behind Tailscale
      # or an authenticated reverse proxy rather than changing this to 0.0.0.0.
      - "127.0.0.1:8000:8000"
    # Settings come from .env: `cp .env.example .env` and fill in the services
    # you use, or generate it with `python server.py --setup --format env --output .env`.
    env_file:
      - .env
    # Alternatively, use a TOML config file from `python server.py --setup`
    # (remove env_file above or keep it for overrides):
    # environment:
    #   - ARRSTACK_CONFIG=/config/arrstack.toml
    # volumes:
    #   - ./arrstack.toml:/config/arrstack.toml:ro
    restart: unless-stopped
    # Put this on the same Docker network as your *arr stack:
    # networks:
    #   - your-network
