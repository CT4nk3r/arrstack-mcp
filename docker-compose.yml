services:
  arrstack-mcp:
    build: .
    container_name: arrstack-mcp
    ports:
      # Published on localhost only: this server has no authentication, and
      # anyone who can reach the port can add or delete downloads. Containers on
      # the same Docker network reach it at http://arrstack-mcp:8000/mcp without
      # this mapping. To reach it from another machine, put it behind Tailscale
      # or an authenticated reverse proxy rather than changing this to 0.0.0.0.
      - "127.0.0.1:8000:8000"
    environment:
      - ENABLED_SERVICES=auto
      # ── Sonarr ──
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=your-sonarr-api-key
      # ── Radarr ──
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=your-radarr-api-key
      # ── Lidarr ──
      - LIDARR_URL=http://lidarr:8686
      - LIDARR_API_KEY=your-lidarr-api-key
      # ── qBittorrent ──
      - QBT_URL=http://qbittorrent:8080
      - QBT_USER=admin
      - QBT_PASS=your-qbittorrent-password
      # ── RDTClient (Real-Debrid downloader, qBT-compatible API) ──
      - RDT_URL=http://rdtclient:6500
      - RDT_USER=admin
      - RDT_PASS=your-rdtclient-password
      # ── Jellyfin ──
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=              # optional
      # ── Prowlarr ──
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=your-prowlarr-api-key
      # ── RomM ──
      - ROMM_URL=http://romm:8080
      - ROMM_API_TOKEN=your-romm-api-token
      # ── GameVault ──
      - GAMEVAULT_URL=http://gamevault-backend:8080
      - GAMEVAULT_API_KEY=your-gamevault-api-key
      # ── MCP Server Security ──
      - MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,arrstack-mcp:*
      - LOG_LEVEL=INFO
      # ── Agentic Resource Discovery (ARD) ──
      # Set ARD_PUBLIC_URL to the public URL clients reach this server at (e.g.
      # https://arrstack.example.com) so it publishes a discoverable catalog at
      # /.well-known/ai-catalog.json. Leave blank for a private deployment.
      - ARD_ENABLED=auto
      - ARD_PUBLIC_URL=
      # ── SABnzbd ──
      - SAB_URL=http://sabnzbd:8080
      - SAB_API_KEY=your-sabnzbd-api-key
      # ── Bookshelf (Hardcover-flavored Readarr fork) ──
      - BOOKSHELF_URL=http://bookshelf:8787
      - BOOKSHELF_API_KEY=your-bookshelf-api-key
      # ── Seerr (media requests: Overseerr / Jellyseerr) ──
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=your-seerr-api-key
    restart: unless-stopped
    # Put this on the same Docker network as your *arr stack:
    # networks:
    #   - your-network
